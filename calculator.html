<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="theme-color" content="#F4F2EE"/>
  <meta name="description" content="Калькулятор расчёта базальтовой ваты · THERMO PLUS"/>
  <meta name="format-detection" content="telephone=no"/>
  <title>THERMO PLUS · Калькулятор</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="apple-touch-icon" href="images/logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">

  <header class="header">
    <a class="logo" href="about.html">
      <div class="logo-mark">
        <img src="images/logo.png" alt="THERMO PLUS"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <span class="logo-mark-fallback" style="display:none">T+</span>
      </div>
      <div>
        <div class="logo-text">THERMO PLUS</div>
        <div class="logo-sub">Калькулятор</div>
      </div>
    </a>
    <div class="lang-wrap">
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="uz">UZ</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </header>

  <div class="page">
    <div style="padding:18px 16px 0" id="calc-top">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px">
        <div style="font-family:var(--font-display);font-size:22px;font-weight:900;color:var(--text);letter-spacing:-0.5px" id="page-title">Калькулятор</div>
        <button id="back-btn" onclick="prevStep()" class="back-btn" style="display:none">
          <span data-icon="chevronLeft"></span>
          <span id="back-label">Назад</span>
        </button>
      </div>
      <div class="calc-progress">
        <div class="calc-progress-bar" id="progress-bar" style="width:0%"></div>
      </div>
    </div>
    <div style="padding:18px 16px 24px" id="calc-body"></div>
  </div>

  <footer class="site-footer">
    <div class="footer-brand">THERMO PLUS</div>
    <div class="footer-meta">
      © <span id="footer-year"></span>
      <span class="footer-dot"></span>
      <span data-i18n="footerMeta">Хорезм, Ургенч · Ташкент</span>
    </div>
  </footer>

  <nav class="bottom-nav">
    <a class="nav-item" href="about.html">
      <span class="nav-icon" data-icon="home"></span>
      <span class="nav-label" data-i18n="home">Главная</span>
    </a>
    <a class="nav-item" href="index.html">
      <span class="nav-icon" data-icon="grid"></span>
      <span class="nav-label" data-i18n="catalog">Каталог</span>
    </a>
    <a class="nav-item nav-item-cart" href="checkout.html">
      <span class="nav-icon">
        <span class="nav-icon-wrap">
          <span data-icon="cart"></span>
          <span class="cart-count nav-cart-badge" style="display:none">0</span>
        </span>
      </span>
      <span class="nav-label" data-i18n="cart">Корзина</span>
    </a>
    <a class="nav-item active" href="calculator.html">
      <span class="nav-icon" data-icon="calc"></span>
      <span class="nav-label" data-i18n="calculator">Калькулятор</span>
    </a>
    <a class="nav-item" href="contacts.html">
      <span class="nav-icon" data-icon="phone"></span>
      <span class="nav-label" data-i18n="contacts">Контакты</span>
    </a>
  </nav>

</div>

<script src="icons.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="calculator.js"></script>
<script src="animations.js"></script>
<script>
if (window.Telegram?.WebApp) {
  Telegram.WebApp.ready();
  try { Telegram.WebApp.expand(); } catch(_){}
}

async function init() {
  initLangButtons();
  await loadProducts();
  renderCalcStep();
}

function onLangChange() { renderCalcStep(); }

init();
const _y = document.getElementById('footer-year'); if (_y) _y.textContent = new Date().getFullYear();
</script>
</body>
</html>
