<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="theme-color" content="#F4F2EE"/>
  <meta name="description" content="Каталог базальтовой ваты THERMO PLUS — фасадные, кровельные, универсальные плиты. Производство в Хорезмской области."/>
  <meta name="format-detection" content="telephone=no"/>
  <title>THERMO PLUS · Каталог</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="apple-touch-icon" href="images/logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="THERMO PLUS — Каталог базальтовой ваты"/>
  <meta property="og:description" content="Огнестойкая базальтовая вата, цена за м². Производство в Хорезме."/>
  <meta property="og:image" content="images/logo.png"/>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">

  <header class="header">
    <a class="logo" href="about.html">
      <div class="logo-mark">
        <img src="images/logo.png" alt="THERMO PLUS"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <span class="logo-mark-fallback" style="display:none">T+</span>
      </div>
      <div>
        <div class="logo-text">THERMO PLUS</div>
        <div class="logo-sub" id="logo-sub">Производитель базальтовой ваты</div>
      </div>
    </a>
    <div class="lang-wrap">
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="uz">UZ</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </header>

  <div class="page">
    <div class="catalog-header">
      <div class="catalog-title" id="page-title">Каталог товаров</div>
      <div style="font-size:13px;color:var(--text-2);margin-top:4px" id="catalog-sub">Базальтовая вата всех типов · цена за м²</div>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <span class="search-icon" data-icon="search"></span>
        <input class="search-input" id="search-input" type="text" placeholder="Поиск продукта..." data-i18n-placeholder="search"/>
        <button class="search-clear hidden" id="search-clear-btn" onclick="clearSearch()" data-icon="close"></button>
      </div>
    </div>

    <div class="cat-scroll" id="cat-scroll"></div>
    <div class="results-meta" id="results-meta" aria-live="polite"></div>
    <div class="prod-grid" id="prod-grid"></div>
    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon" data-icon="search"></div>
      <div class="empty-title" data-i18n="noResults">Ничего не найдено</div>
      <div class="empty-text" data-i18n="noResultsText">Попробуйте другой запрос</div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-brand">THERMO PLUS</div>
    <div class="footer-meta">
      © <span id="footer-year"></span>
      <span class="footer-dot"></span>
      <span data-i18n="footerMeta">Хорезм, Ургенч · Ташкент</span>
    </div>
  </footer>

  <button class="float-cart" id="float-cart-btn" onclick="location.href='checkout.html'" style="display:none">
    <span data-icon="cart"></span>
    <span data-i18n="cart">Корзина</span>
    <span class="float-badge cart-count">0</span>
  </button>

  <nav class="bottom-nav">
    <a class="nav-item" href="about.html">
      <span class="nav-icon" data-icon="home"></span>
      <span class="nav-label" data-i18n="home">Главная</span>
    </a>
    <a class="nav-item active" href="index.html">
      <span class="nav-icon" data-icon="grid"></span>
      <span class="nav-label" data-i18n="catalog">Каталог</span>
    </a>
    <a class="nav-item nav-item-cart" href="checkout.html">
      <span class="nav-icon">
        <span class="nav-icon-wrap">
          <span data-icon="cart"></span>
          <span class="cart-count nav-cart-badge" style="display:none">0</span>
        </span>
      </span>
      <span class="nav-label" data-i18n="cart">Корзина</span>
    </a>
    <a class="nav-item" href="calculator.html">
      <span class="nav-icon" data-icon="calc"></span>
      <span class="nav-label" data-i18n="calculator">Калькулятор</span>
    </a>
    <a class="nav-item" href="contacts.html">
      <span class="nav-icon" data-icon="phone"></span>
      <span class="nav-label" data-i18n="contacts">Контакты</span>
    </a>
  </nav>

</div>

<script src="icons.js?v=6"></script>
<script src="i18n.js?v=6"></script>
<script src="app.js?v=6"></script>
<script src="animations.js?v=6"></script>
<script>
const CATEGORIES_LIST = [
  { key:'all',       icon:null },
  { key:'facade',    icon:'facade' },
  { key:'vent',      icon:'vent' },
  { key:'roof',      icon:'roof' },
  { key:'floor',     icon:'floor' },
  { key:'universal', icon:'universal' },
  { key:'sandwich',  icon:'sandwich' },
];

let activeCat = 'all';
let searchQuery = '';

const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('cat')) activeCat = urlParams.get('cat');

function getCatLabel(key, lang) {
  if (key === 'all') return lang === 'uz' ? 'Hammasi' : lang === 'en' ? 'All' : 'Все';
  return (CAT_LABELS[lang] || CAT_LABELS['ru'])[key] || key;
}

function renderCategories() {
  const lang = getCurrentLang();
  document.getElementById('cat-scroll').innerHTML = CATEGORIES_LIST.map(c => `
    <div class="cat-chip ${activeCat===c.key?'active':''}" onclick="filterCat('${c.key}')">
      ${c.icon ? `<span style="display:flex;width:14px;height:14px" data-icon="${c.icon}"></span>` : ''}
      ${getCatLabel(c.key, lang)}
    </div>`).join('');
  if (typeof injectIcons === 'function') injectIcons();
}

function filterCat(key) {
  activeCat = key;
  if (window.hap) window.hap('light');
  renderCategories();
  renderProducts();
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  searchQuery = '';
  document.getElementById('search-clear-btn').classList.add('hidden');
  renderProducts();
}

function renderProducts() {
  const lang = getCurrentLang();
  const filtered = PRODUCTS_DATA.filter(p => {
    const catOk = activeCat === 'all' || p.category === activeCat;
    const q = searchQuery.toLowerCase();
    const searchOk = !q || p.name.toLowerCase().includes(q) || p.category.includes(q)
      || (p.desc_ru||'').toLowerCase().includes(q)
      || (p.desc_uz||'').toLowerCase().includes(q);
    return catOk && searchOk;
  });
  const grid = document.getElementById('prod-grid');
  const empty = document.getElementById('empty-state');
  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
  } else {
    empty.classList.add('hidden');
    grid.innerHTML = filtered.map(p => buildProductCard(p, thickState[p.id])).join('');
  }
  renderResultsMeta(filtered.length);
  Cart.updateBadge();
  if (typeof injectIcons === 'function') injectIcons();
}

function renderResultsMeta(count) {
  const el = document.getElementById('results-meta');
  if (!el) return;
  const filterActive = activeCat !== 'all';
  const queryActive = !!searchQuery;
  if (!filterActive && !queryActive) { el.innerHTML = ''; return; }
  const lang = getCurrentLang();
  const closeSvg = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`;
  const parts = [`<span><strong>${count}</strong> ${t('foundN')}</span>`];
  if (filterActive) {
    parts.push(`<span class="filter-chip">
      ${getCatLabel(activeCat, lang)}
      <button type="button" onclick="filterCat('all')" aria-label="clear">${closeSvg}</button>
    </span>`);
  }
  el.innerHTML = parts.join('');
}

function onLangChange() {
  document.getElementById('logo-sub').textContent = t('appSub');
  const lang = getCurrentLang();
  const sub = lang === 'uz' ? "Bazalt vata barcha turlari · m² uchun narx" : lang === 'en' ? "All types of basalt wool · price per m²" : "Базальтовая вата всех типов · цена за м²";
  document.getElementById('catalog-sub').textContent = sub;
  document.getElementById('page-title').textContent = t('catalog');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.getAttribute('data-i18n-placeholder')));
  renderCategories();
  renderProducts();
}

async function init() {
  if (window.Telegram?.WebApp) {
    Telegram.WebApp.ready();
    try { Telegram.WebApp.expand(); } catch(_){}
  }
  initLangButtons();
  document.getElementById('logo-sub').textContent = t('appSub');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.getAttribute('data-i18n-placeholder')));
  await loadProducts();
  onLangChange();
  initFloatCart();
  document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value;
    document.getElementById('search-clear-btn').classList.toggle('hidden', !searchQuery);
    renderProducts();
  });
}

init();
const _y = document.getElementById('footer-year'); if (_y) _y.textContent = new Date().getFullYear();
</script>
</body>
</html>
