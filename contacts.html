function renderContacts() {
  const lang = getCurrentLang();
  const txc = CONTACTS_TX[lang] || CONTACTS_TX.ru;

  document.getElementById('logo-sub').textContent = txc.logoSub;
  document.getElementById('comp-addr').innerHTML = txc.addr;
  document.getElementById('page-title').textContent = txc.pageTitle;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));

  const contactsHtml = txc.contacts.map((c, i) => `
    <div class="contact-card reveal" style="margin-bottom:8px;animation-delay:${i*60}ms">
      <div class="contact-icon-box" data-icon="${c.icon}"></div>
      <div style="flex:1;min-width:0">
        <div class="contact-key">${c.key}</div>
        <div class="contact-val">${c.val}</div>
      </div>
      <div class="contact-act">
        <a href="${c.href}" target="_blank" rel="noreferrer" style="text-decoration:none">
          <button class="contact-act-btn">${c.act}</button>
        </a>
      </div>
    </div>`).join('');

  const hoursHtml = txc.hours.map(([day, time, closed]) => `
    <div class="hours-row">
      <span class="hours-day">${day}</span>
      <span class="hours-time ${closed ? 'closed' : ''}">${time}</span>
    </div>`).join('');

  const addrHtml = txc.addrRows.map(([type, addr]) => `
    <div style="padding:12px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start">
      <div style="width:32px;height:32px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0" data-icon="pin"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:3px">${type}</div>
        <div style="font-size:13px;font-weight:600;color:var(--text);line-height:1.45">${addr}</div>
      </div>
    </div>`).join('');

  const certHtml = txc.certs.map(c => `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;font-weight:500;color:var(--text)">
      <span style="width:24px;height:24px;border-radius:50%;background:var(--green-bg);display:flex;align-items:center;justify-content:center;color:var(--green);flex-shrink:0">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </span>
      ${c}
    </div>`).join('');

  document.getElementById('contacts-body').innerHTML = `
    ${contactsHtml}

    <div class="section-card reveal" style="margin-top:6px">
      <div class="section-card-title">${txc.hoursTitle}</div>
      ${hoursHtml}
    </div>

    <div class="section-card reveal">
      <div class="section-card-title">${txc.addrTitle}</div>
      <div style="padding-bottom:4px">${addrHtml}</div>
    </div>

    <div class="section-card reveal">
      <div class="section-card-title">${txc.certTitle}</div>
      ${certHtml}
    </div>

    <div class="cta-banner reveal" style="margin:0 0 24px">
      <div class="cta-banner-title">${txc.dealerTitle}</div>
      <div class="cta-banner-sub">${txc.dealerText}</div>
      <a href="tel:+998901500000" style="text-decoration:none;align-self:flex-start">
        <button class="btn-white">
          <span data-icon="phone"></span>
          ${txc.dealerBtn}
        </button>
      </a>
    </div>`;

  if (typeof injectIcons === 'function') injectIcons();
  if (window.TPAnim) window.TPAnim.refreshAll();
}
